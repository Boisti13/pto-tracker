{% extends "base.html" %}
{% block title %}Set up PTO Tracker{% endblock %}
{% block content %}
<div class="card login-box">
  <h2>First-time setup</h2>
  <p class="muted">Create your admin login and set your default yearly PTO allowance.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" required>
    <label for="allowance">Default yearly PTO allowance (days)</label>
    <input id="allowance" name="allowance" type="number" step="0.5" value="{{ default_allowance }}" required>
    <p style="margin-top:20px;"><button class="btn" type="submit">Create account</button></p>
  </form>
</div>
{% endblock %}
